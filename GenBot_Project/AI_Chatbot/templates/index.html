<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenBot – AI Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">

    <!-- Welcome Screen -->
    <div id="welcome-screen">
        <div class="welcome-glow"></div>
        <div class="welcome-content">
            <div class="bot-avatar-large">
                <div class="avatar-ring"></div>
                <span class="bot-icon">🤖</span>
            </div>
            <h1 class="welcome-title">GenBot</h1>
            <p class="welcome-sub">Your Intelligent AI Assistant</p>
            <p class="welcome-desc">Ask me about Whats on your mind?!</p>
            <button class="start-btn" onclick="startChat()">
                <span>Start Chatting</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </div>
    </div>

    <!-- Chat App -->
    <div id="chat-app" class="hidden">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <div class="bot-avatar-small">🤖</div>
                <div>
                    <h2 class="header-title">GenBot</h2>
                    <span class="status-dot"></span><span class="status-text">Online</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleHistory()" title="Chat History">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </button>
                <button class="icon-btn" onclick="toggleDarkMode()" title="Toggle Theme" id="theme-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <button class="icon-btn" onclick="clearChat()" title="Clear Chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
                </button>
            </div>
        </header>

        <!-- Chat Messages -->
        <div class="chat-body" id="chat-body">
            <div class="chat-date-divider"><span>Today</span></div>
            <div class="message bot-message animate-in">
                <div class="msg-avatar">🤖</div>
                <div class="msg-bubble">
                    <p>Hey there! 👋 I'm <strong>GenBot</strong>, your AI assistant!</p>
                    <p>Ask me about <em>Artificial Intelligence, Machine Learning, Python, Flask</em>, or just have a chat!</p>
                    <span class="msg-time">Just now</span>
                </div>
            </div>
        </div>

        <!-- History Panel -->
        <div class="history-panel hidden" id="history-panel">
            <div class="history-header">
                <h3>Chat History</h3>
                <button class="icon-btn" onclick="toggleHistory()">✕</button>
            </div>
            <div class="history-list" id="history-list"></div>
        </div>

        <!-- Input Area -->
        <div class="chat-footer">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" onkeydown="handleKey(event)">
                <button class="send-btn" onclick="sendMessage()" id="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
            <div class="quick-suggestions">
                <button class="suggestion-chip" onclick="quickSend('What is Machine Learning?')">🧠 What is ML?</button>
                <button class="suggestion-chip" onclick="quickSend('Tell me a joke')">😂 Joke</button>
                <button class="suggestion-chip" onclick="quickSend('What is Python?')">🐍 Python</button>
                <button class="suggestion-chip" onclick="quickSend('What is Flask?')">🌐 Flask</button>
            </div>
        </div>
    </div>

    <script>
        function startChat() {
            document.getElementById('welcome-screen').style.opacity = '0';
            document.getElementById('welcome-screen').style.transform = 'scale(0.95)';
            setTimeout(() => {
                document.getElementById('welcome-screen').classList.add('hidden');
                document.getElementById('chat-app').classList.remove('hidden');
                document.getElementById('chat-app').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('chat-app').style.opacity = '1';
                }, 50);
            }, 400);
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function quickSend(msg) {
            document.getElementById('user-input').value = msg;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            addMessage(message, 'user');
            showTyping();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message})
                });
                const data = await res.json();
                hideTyping();
                addMessage(data.response, 'bot', data.timestamp);
            } catch (err) {
                hideTyping();
                addMessage("Oops! Something went wrong. Please try again! 😅", 'bot');
            }
        }

        function addMessage(text, sender, time = null) {
            const chatBody = document.getElementById('chat-body');
            const div = document.createElement('div');
            div.className = `message ${sender}-message animate-in`;

            const now = time || new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});

            if (sender === 'bot') {
                div.innerHTML = `
                    <div class="msg-avatar">🤖</div>
                    <div class="msg-bubble">
                        <p>${text}</p>
                        <span class="msg-time">${now}</span>
                    </div>`;
            } else {
                div.innerHTML = `
                    <div class="msg-bubble user-bubble">
                        <p>${text}</p>
                        <span class="msg-time">${now}</span>
                    </div>`;
            }

            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function showTyping() {
            const chatBody = document.getElementById('chat-body');
            const div = document.createElement('div');
            div.className = 'message bot-message';
            div.id = 'typing-indicator';
            div.innerHTML = `
                <div class="msg-avatar">🤖</div>
                <div class="msg-bubble typing-bubble">
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                </div>`;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        async function toggleHistory() {
            const panel = document.getElementById('history-panel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                const res = await fetch('/history');
                const history = await res.json();
                const list = document.getElementById('history-list');
                list.innerHTML = history.length ? history.map(h => `
                    <div class="history-item">
                        <div class="history-user">👤 ${h.user}</div>
                        <div class="history-bot">🤖 ${h.bot}</div>
                        <div class="history-time">${h.time}</div>
                    </div>`).join('') : '<p class="no-history">No history yet!</p>';
            }
        }

        async function clearChat() {
            await fetch('/clear');
            const chatBody = document.getElementById('chat-body');
            chatBody.innerHTML = `
                <div class="chat-date-divider"><span>Today</span></div>
                <div class="message bot-message animate-in">
                    <div class="msg-avatar">🤖</div>
                    <div class="msg-bubble">
                        <p>Chat cleared! Start fresh. How can I help you? 😊</p>
                        <span class="msg-time">Just now</span>
                    </div>
                </div>`;
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('light-mode');
        }
    </script>
</body>
</html>
